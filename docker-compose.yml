services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password
      POSTGRES_DB: quiz_builder
    ports:
      - "5433:5432"
    volumes:
      - quiz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz_user -d quiz_builder"]
      interval: 5s
      retries: 10
volumes:
  quiz_pg_data:
